name: dashboard

services:
  dashboard:
    build: .
    container_name: dashboard
    restart: unless-stopped
    # Deployed as a git-backed Portainer stack: Portainer writes the stack's
    # environment variables to stack.env in its own checkout of this repo.
    env_file:
      - stack.env
    volumes:
      # Absolute path: Portainer runs compose from its own checkout. Editing
      # this file changes the site list immediately, no rebuild needed.
      - /home/michael/apps/dashboard/sites.json:/app/sites.json:ro
    ports:
      - '8008:8000'
    networks:
      - proxy

networks:
  proxy:
    external: true
